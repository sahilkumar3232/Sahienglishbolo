function ProgressBar({ total, current, color }) {
  return (
    <div style={{ width: "100%", height: "8px", background: "#E5E7EB", borderRadius: "999px", overflow: "hidden" }}>
      <div style={{ width: `${((current + 1) / total) * 100}%`, height: "100%", background: color, borderRadius: "999px", transition: "width 0.3s ease" }} />
    </div>
  );
}

function FlashCard({ phrase, color, soft }) {
  const [flipped, setFlipped] = useState(false);
  return (
    <div className="flip-card" onClick={() => setFlipped((f) => !f)} style={{ cursor: "pointer" }}>
      <div className={`flip-inner ${flipped ? "flipped" : ""}`}>
        <div className="flip-face" style={{ background: "#fff", border: `1.5px solid ${soft}`, boxShadow: "0 2px 6px rgba(17,24,39,0.05)" }}>
          <div style={{ fontSize: "11px", fontWeight: 700, color: color, marginBottom: "6px", fontFamily: "'Inter', sans-serif" }}>ENGLISH · टैप करें</div>
          <div style={{ fontFamily: "'Inter', sans-serif", fontWeight: 600, fontSize: "16px", color: "#111827", lineHeight: 1.4 }}>{phrase.en}</div>
        </div>
        <div className="flip-face flip-back" style={{ background: soft }}>
          <div style={{ fontSize: "11px", fontWeight: 700, color: color, marginBottom: "6px", fontFamily: "'Inter', sans-serif" }}>हिंदी अर्थ</div>
          <div style={{ fontFamily: "'Noto Sans Devanagari', sans-serif", fontWeight: 700, fontSize: "16px", color: "#111827", marginBottom: "8px" }}>{phrase.hi}</div>
          <div style={{ fontSize: "12px", color: "#6B7280", fontFamily: "'Noto Sans Devanagari', sans-serif" }}>उच्चारण: {phrase.pr}</div>
        </div>
      </div>
    </div>
  );
}

function LearnScreen({ category }) {
  const phrases = PHRASES[category.id];
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: "14px", paddingTop: "18px" }}>
      {phrases.map((p, i) => (
        <FlashCard key={i} phrase={p} color={category.color} soft={category.soft} />
      ))}
    </div>
  );
}

function QuizScreen({ category, onFinish }) {
  const questions = QUIZ[category.id];
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [feedback, setFeedback] = useState("");
  const [isCorrect, setIsCorrect] = useState(null);
  const [done, setDone] = useState(false);

  const q = questions[idx];

  function handleAnswer(opt) {
    if (selected) return;
    setSelected(opt);
    const correct = opt === q.a;
    setIsCorrect(correct);
    if (correct) { setScore((s) => s + 1); setFeedback(GOOD[Math.floor(Math.random() * GOOD.length)]); }
    else { setFeedback(TRY[Math.floor(Math.random() * TRY.length)]); }
    setTimeout(() => {
      if (idx + 1 < questions.length) { setIdx((i) => i + 1); setSelected(null); setFeedback(""); setIsCorrect(null); }
      else { setDone(true); }
    }, 1300);
  }

  if (done) {
    const pct = Math.round((score / questions.length) * 100);
    let msg = "और अभ्यास करें, अच्छा होगा।";
    if (pct >= 80) msg = "बहुत बढ़िया! आप तैयार हैं।";
    else if (pct >= 50) msg = "अच्छी कोशिश, थोड़ा और practice करें।";
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "60px 10px", textAlign: "center" }}>
        <div style={{
          width: "84px", height: "84px", borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
          background: category.soft, fontSize: "28px", marginBottom: "18px", color: category.color, fontFamily: "'Poppins', sans-serif", fontWeight: 700,
        }}>{pct}%</div>
        <h2 style={{ fontFamily: "'Noto Sans Devanagari', sans-serif", color: "#111827", fontWeight: 700, fontSize: "20px", margin: "0 0 8px" }}>{msg}</h2>
        <p style={{ fontFamily: "'Inter', sans-serif", color: "#6B7280", fontSize: "15px", marginBottom: "24px" }}>Score: {score} / {questions.length}</p>
        <button onClick={() => { setIdx(0); setSelected(null); setScore(0); setDone(false); setFeedback(""); setIsCorrect(null); }}
          style={{ borderRadius: "12px", padding: "12px 22px", fontWeight: 600, background: category.color, color: "#fff", border: "none", fontFamily: "'Inter', sans-serif", cursor: "pointer" }}>
          फिर से Practice करें
        </button>
      </div>
    );
  }

  return (
    <div style={{ paddingTop: "16px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "10px" }}>
        <span style={{ fontSize: "13px", fontWeight: 600, color: "#6B7280", fontFamily: "'Inter', sans-serif" }}>{idx + 1} / {questions.length}</span>
        <span style={{ fontSize: "13px", fontWeight: 700, color: category.color, fontFamily: "'Inter', sans-serif" }}>{score} pts</span>
      </div>
      <ProgressBar total={questions.length} current={idx} color={category.color} />

      <div style={{
        marginTop: "22px", background: "#fff", borderRadius: "20px", padding: "24px 20px",
        boxShadow: "0 4px 16px rgba(17,24,39,0.06)", animation: "popIn 0.25s ease",
      }}>
        <div style={{
          display: "inline-block", fontSize: "12px", fontWeight: 700, color: category.color, background: category.soft,
          padding: "4px 12px", borderRadius: "999px", marginBottom: "14px", fontFamily: "'Inter', sans-serif",
        }}>सही English sentence चुनें</div>
        <h2 style={{ fontFamily: "'Noto Sans Devanagari', sans-serif", color: "#111827", fontWeight: 700, fontSize: "18px", margin: "0 0 20px", lineHeight: 1.5 }}>{q.hi}</h2>

        <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
          {q.opts.map((opt) => {
            const isSelected = selected === opt;
            const optCorrect = opt === q.a;
            let bg = "#F9FAFB", border = "#E5E7EB", textColor = "#111827";
            if (selected) {
              if (optCorrect) { bg = "#ECFDF5"; border = "#10B981"; textColor = "#047857"; }
              else if (isSelected) { bg = "#FEF2F2"; border = "#F87171"; textColor = "#B91C1C"; }
            }
            return (
              <button key={opt} disabled={!!selected} onClick={() => handleAnswer(opt)} style={{
                textAlign: "left", borderRadius: "12px", padding: "13px 16px", fontSize: "14.5px", fontWeight: 500,
                background: bg, border: `1.5px solid ${border}`, color: textColor,
                fontFamily: "'Inter', sans-serif", cursor: selected ? "default" : "pointer",
              }}>{opt}</button>
            );
          })}
        </div>
      </div>

      <div style={{ height: "30px", marginTop: "14px", textAlign: "center" }}>
        {feedback && (
          <p style={{ fontFamily: "'Noto Sans Devanagari', sans-serif", fontWeight: 600, fontSize: "15px", margin: 0, color: isCorrect ? "#047857" : "#B91C1C" }}>
            {isCorrect ? "✓ " : "✕ "}{feedback}
          </p>
        )}
      </div>
    </div>
  );
}

function CategoryScreen({ categoryId, onExit }) {
  const category = CATEGORIES.find((c) => c.id === categoryId);
  const [tab, setTab] = useState("learn");

  return (
    <div style={{ padding: "24px 20px 40px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "18px" }}>
        <button onClick={onExit} style={{ padding: "8px 10px", borderRadius: "10px", background: category.soft, border: "none", cursor: "pointer", fontSize: "14px", color: category.color, fontWeight: 600, fontFamily: "'Inter', sans-serif" }}>
          ← वापस
        </button>
        <div style={{ fontFamily: "'Poppins', sans-serif", fontWeight: 700, fontSize: "17px", color: "#111827" }}>
          {category.icon} {category.title}
        </div>
        <div style={{ width: "56px" }} />
      </div>

      <div style={{ display: "flex", gap: "8px", background: "#EEF0F4", borderRadius: "12px", padding: "4px", marginBottom: "6px" }}>
        <button onClick={() => setTab("learn")} style={{
          flex: 1, padding: "10px", borderRadius: "9px", border: "none", fontWeight: 700, fontSize: "14px",
          background: tab === "learn" ? "#fff" : "transparent", color: tab === "learn" ? category.color : "#6B7280",
          boxShadow: tab === "learn" ? "0 1px 4px rgba(0,0,0,0.08)" : "none", cursor: "pointer", fontFamily: "'Inter', sans-serif",
        }}>सीखो</button>
        <button onClick={() => setTab("quiz")} style={{
          flex: 1, padding: "10px", borderRadius: "9px", border: "none", fontWeight: 700, fontSize: "14px",
          background: tab === "quiz" ? "#fff" : "transparent", color: tab === "quiz" ? category.color : "#6B7280",
          boxShadow: tab === "quiz" ? "0 1px 4px rgba(0,0,0,0.08)" : "none", cursor: "pointer", fontFamily: "'Inter', sans-serif",
        }}>Practice करो</button>
      </div>

      {tab === "learn" ? <LearnScreen category={category} /> : <QuizScreen category={category} onFinish={() => {}} />}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("home");
  const [categoryId, setCategoryId] = useState(null);

  return (
    <div style={{ width: "100%", minHeight: "100vh", background: "linear-gradient(180deg, #F4F6FB 0%, #ECEFF8 100%)" }}>
      <div style={{ maxWidth: "480px", margin: "0 auto", minHeight: "100vh", background: "#F8F9FC" }}>
        {screen === "home" && <HomeScreen onPick={(id) => { setCategoryId(id); setScreen("category"); }} />}
        {screen === "category" && <CategoryScreen categoryId={categoryId} onExit={() => setScreen("home")} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
